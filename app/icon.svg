  <rect class="bg" width="64" height="64" rx="14"></rect>

  <text class="text" x="8" y="44" font-family="Arial, sans-serif" font-size="32" font-weight="900" letter-spacing="-2">
    JR
  </text>

  <circle class="accent" cx="53" cy="49" r="4"></circle>
</svg>